name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Check release scripts and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test release scripts
        run: python3 -m unittest discover -s tests -v

      - name: Check release tag against recipe
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          from pathlib import Path
          import re

          recipe = Path("recipe/recipe.yaml").read_text(encoding="utf-8")
          version = re.search(r'^  version: "([0-9.]+)"$', recipe, re.MULTILINE)[1]
          build = re.search(r"^  build_number: ([0-9]+)$", recipe, re.MULTILINE)[1]
          expected = f"{version}-{build}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match recipe version and build: {expected}")

  build:
    name: Build recipe with ${{ matrix.compiler }} for ${{ matrix.target-platform }}
    needs: [validate]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC stack on Windows is only available for win-64
          - compiler: gcc
            target-platform: win-64
            runs-on: windows-latest

          # conda-forge maintain doesn't really maintain a win-32 stack for MSVC anymore
          - compiler: vs
            target-platform: win-64
            runs-on: windows-latest
          - compiler: vs
            target-platform: win-arm64
            runs-on: windows-11-arm

          - compiler: zig
            target-platform: win-32
            runs-on: windows-latest
          - compiler: zig
            target-platform: win-64
            runs-on: windows-latest
          - compiler: zig
            target-platform: win-arm64
            runs-on: windows-11-arm
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Pixi info
        run: |
          pixi info
          pixi list

      - name: Run Build
        run: |
          pixi run rattler-build build `
          --recipe recipe `
          --ignore-recipe-variants `
          --variant-config recipe\variants\${{ matrix.compiler }}.yaml `
          --target-platform ${{ matrix.target-platform }} `
          --log-style plain `
          --skip-existing all `
          --channel conda-forge `
          --extra-meta flow_run_id="github_$GITHUB_RUN_ID" `
          --extra-meta remote_url="https://github.com/$GITHUB_REPOSITORY" `
          --extra-meta sha="$GITHUB_SHA"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-launchers-builds-${{ matrix.compiler }}-${{ matrix.target-platform }}
          if-no-files-found: error
          path: |
            ./output/${{ matrix.target-platform }}/conda-launchers*.conda

  upload-channel:
    name: Upload to canary channel
    needs: [build]
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: conda-launchers-builds-*

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          cache: false
          environments: default extract

      - name: Pixi info
        run: |
          pixi info
          pixi list
          pixi list -e extract

      - name: List artifacts
        run: |
          dir artifacts -Recurse

      - name: Stage launchers for repackaging
        run: |
          mkdir recipe\staged
          mkdir extracted
          $selections = @(
            @{ Folder = "conda-launchers-builds-zig-win-32"; Arch = "32" },
            @{ Folder = "conda-launchers-builds-gcc-win-64"; Arch = "64" },
            @{ Folder = "conda-launchers-builds-vs-win-arm64"; Arch = "arm64" }
          )
          foreach ($sel in $selections) {
            $package = Get-ChildItem "artifacts/$($sel.Folder)/conda-launchers-*.conda" | Select-Object -First 1
            Write-Host "Extracting $($package.Name)..."
            pixi run -e extract cph x $package.FullName --prefix extracted
            foreach ($kind in @("cli", "gui")) {
              $exe = "$kind-$($sel.Arch).exe"
              Copy-Item "extracted/$($package.BaseName)/share/conda-launchers/$exe" "recipe/staged/$exe"
            }
          }
          dir recipe\staged

      - name: Build noarch package
        run: |
          pixi run rattler-build build `
          --recipe recipe `
          --ignore-recipe-variants `
          --variant-config recipe\variants\repackage.yaml `
          --target-platform win-64 `
          --log-style plain `
          --skip-existing all `
          --channel conda-forge `
          --extra-meta flow_run_id="github_$GITHUB_RUN_ID" `
          --extra-meta remote_url="https://github.com/$GITHUB_REPOSITORY" `
          --extra-meta sha="$GITHUB_SHA"

      - name: Upload to Anaconda
        if: github.event_name == 'push'
        env:
          # rattler-build upload knows how to take auth from these env vars
          ANACONDA_OWNER: conda-canary
          ANACONDA_CHANNEL: dev
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_ORG_CONDA_CANARY_TOKEN }}
        run: |
          pixi run rattler-build upload anaconda --log-style plain (Get-Item ./output/noarch/conda-launchers*.conda).FullName

  sign:
    name: Sign release executables
    needs: [build]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output
          pattern: conda-launchers-builds-*
          merge-multiple: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          cache: false
          environments: extract

      - name: Pixi info
        run: |
          pixi info
          pixi list -e extract

      - name: List artifacts
        run: |
          dir output

      - name: Extract and rename executables
        run: |
          mkdir extracted
          mkdir isolated
          foreach ($artifact in (Get-ChildItem "output/*.conda")) {
            Write-Host "Extracting $($artifact.Name)..."
            $versionBuild = $artifact.BaseName -replace "conda-launchers-"
            pixi run -e extract cph x $artifact.FullName --prefix "extracted"
            Write-Host "Isolating launchers..."
            foreach ($executable in (Get-ChildItem "extracted/$($artifact.BaseName)/share/conda-launchers/*-*.exe")) {
              Write-Host "  $($executable.Name)"
              Copy-Item -Path "$executable" -Destination "isolated/$($executable.BaseName)-$versionBuild.exe"
            }
          }

      - name: List executables
        run: |
          dir isolated

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: >-
            {
              "clientId": "${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_SECRET_VALUE }}",
              "subscriptionId": "${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}"
            }

      - name: Sign files with Artifact Signing
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.WINDOWS_SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\isolated
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        run: |
          $exitCode = 0
          foreach ($executable in (Get-ChildItem "isolated/*.exe")) {
            Write-Host "******************************************"
            Write-Host $executable.Name
            Write-Host "******************************************"
            $sig = Get-AuthenticodeSignature -FilePath $executable.FullName
            $sig | Format-List * | Out-String | Write-Host
            if ($sig.Status -ne 'Valid') {
              Write-Error "CRITICAL: Signature verification failed for $($executable.Name)!"
              $exitCode = 1
            }
          }
          exit $exitCode

      - name: Generate SHA256 files
        run: |
          foreach ($executable in (Get-ChildItem "isolated/*.exe")) {
            $hashObject = Get-FileHash $executable.FullName
            $hashObject.Hash | Out-File -FilePath "$($executable.FullName).sha256"
            Write-Host "SHA256($($executable.Name)): $($hashObject.Hash)"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-launchers-signed
          if-no-files-found: error
          path: |
            ./isolated/*.exe
            ./isolated/*.sha256

  # Attach every asset before publishing, as discussed in #25:
  # https://github.com/conda/conda-launchers/issues/25#issuecomment-4865131894
  create-draft-release:
    name: Attach signed executables to draft release
    needs: [sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conda-launchers-signed
          path: isolated

      - name: Check assets and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(isolated/*)
          if [[ "${#files[@]}" -ne 24 ]]; then
            echo "Expected 12 executables and 12 checksum files." >&2
            exit 1
          fi

          version="${RELEASE_TAG%-*}"
          build="${RELEASE_TAG##*-}"
          for variant in 32_zig 64_gcc 64_vs2022 arm64_vs2022 64_zig arm64_zig; do
            arch="${variant%%_*}"
            compiler="${variant#*_}"
            for kind in cli gui; do
              executables=(isolated/"${kind}-${arch}-${version}-"*"_${compiler}_${build}.exe")
              if [[ "${#executables[@]}" -ne 1 ]]; then
                echo "Expected one ${kind}-${arch} executable built with ${compiler} for ${RELEASE_TAG}." >&2
                exit 1
              fi
              executable="${executables[0]}"
              printf '%s  %s\n' "$(tr -d '\r\n' < "${executable}.sha256")" "$executable" |
                sha256sum -c - > /dev/null
            done
          done

          releases=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            echo "Release $RELEASE_TAG already exists. Inspect it before retrying. Published assets must not be replaced." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --draft --verify-tag --title "$RELEASE_TAG" --generate-notes --repo "$GH_REPO"

          cleanup_draft() {
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" == true ]]; then
              gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes ||
                echo "Could not remove draft $RELEASE_TAG. Inspect it before retrying." >&2
            else
              echo "Release $RELEASE_TAG was left unchanged. Inspect it before retrying." >&2
            fi
          }
          trap cleanup_draft ERR
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO"
          trap - ERR

  publish-github-release:
    name: Publish GitHub release
    needs: [create-draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
